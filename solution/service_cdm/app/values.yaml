# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # Link to your container registry. You will launch it in Yandex Cloud.
  repository: cr.yandex/crp9vlq26b21d42l1tfg/cdm_service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v2026-09-26-r2"

containerPort: 5000

# Значения попадают в ConfigMap и из него — в переменные окружения контейнера.
# Пароли в репозитории не хранятся: при релизе они передаются отдельным файлом
#   helm upgrade --install --atomic cdm-service app -f <secrets.yaml> -n <namespace>
# где secrets.yaml содержит config.KAFKA_CONSUMER_PASSWORD и config.PG_WAREHOUSE_PASSWORD.
config:
  KAFKA_HOST: "rc1b-2v2jbetiog4dhlq3.mdb.yandexcloud.net"
  KAFKA_PORT: "9091"
  KAFKA_CONSUMER_USERNAME: "producer_consumer"
  KAFKA_CONSUMER_PASSWORD: ""
  KAFKA_CONSUMER_GROUP: "cdm-service-group"
  KAFKA_SOURCE_TOPIC: "dds-service-orders"

  PG_WAREHOUSE_HOST: "rc1b-7m8ti2tgacp2sp88.mdb.yandexcloud.net"
  PG_WAREHOUSE_PORT: "6432"
  PG_WAREHOUSE_DBNAME: "sprint9dwh"
  PG_WAREHOUSE_USER: "user1"
  PG_WAREHOUSE_PASSWORD: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
