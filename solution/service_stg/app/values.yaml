# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # Link to your container registry. You will launch it in Yandex Cloud.
  repository: cr.yandex/crp9vlq26b21d42l1tfg/stg_service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v2026-09-26-r2"

containerPort: 5000

# Значения попадают в ConfigMap и из него — в переменные окружения контейнера.
# Имена — те, что читает app_config.py (не те, что в .env):
# топик назначения здесь сразу KAFKA_DESTINATION_TOPIC.
config:
  KAFKA_HOST: "rc1b-2v2jbetiog4dhlq3.mdb.yandexcloud.net"
  KAFKA_PORT: "9091"
  KAFKA_CONSUMER_USERNAME: "producer_consumer"
  KAFKA_CONSUMER_PASSWORD: ""
  # v2: перечитка топика с начала после добавления user.login в контракт
  KAFKA_CONSUMER_GROUP: "stg-service-group-v2"
  KAFKA_SOURCE_TOPIC: "order-service_orders"
  KAFKA_DESTINATION_TOPIC: "stg-service-orders"

  PG_WAREHOUSE_HOST: "rc1b-7m8ti2tgacp2sp88.mdb.yandexcloud.net"
  PG_WAREHOUSE_PORT: "6432"
  PG_WAREHOUSE_DBNAME: "sprint9dwh"
  PG_WAREHOUSE_USER: "user1"
  PG_WAREHOUSE_PASSWORD: ""

  REDIS_HOST: "c-c9qkub5koki3edcvc7jd.rw.mdb.yandexcloud.net"
  REDIS_PORT: "6380"
  REDIS_PASSWORD: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
